<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080,initial-scale=1">
  <title>PlayOnMyTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="pairing" class="pairing-screen">
      <div class="pairing-card">
        <div class="brand">PlayOnMyTV</div>
        <div class="subtitle">Digital Signage</div>
        <div class="eyebrow">DEVICE CODE</div>
        <div id="pairingCode" class="pairing-code">------</div>
        <div id="pairingState" class="pairing-state">Connecting…</div>
        <div class="pairing-help">Enter this code in your PlayOnMyTV dashboard</div>
        <div class="spinner" aria-hidden="true"></div>
        <div id="pairingError" class="error"></div>
      </div>
    </section>

    <section id="player" hidden>
      <img id="image" alt="" hidden>
      <video id="video" playsinline preload="auto" hidden></video>
      <div id="empty" class="empty">No media available</div>
      <div id="status" class="status">Ready</div>
      <div id="sync" class="sync" hidden>
        <div class="sync-title"><span id="syncTitle">Preparing content…</span> <span id="syncText">0%</span></div>
        <div class="track"><div id="syncBar" class="bar"></div></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
