<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080,initial-scale=1">
  <title>PlayOnMyTV</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section id="setup" class="panel">
      <div class="brand">PlayOnMyTV</div>
      <p class="subtitle">LG webOS Digital Signage</p>
      <label for="apiUrl">API URL</label>
      <input id="apiUrl" value="https://playonmytv-web.onrender.com/api/v1" />
      <label for="token">Device token</label>
      <input id="token" type="password" placeholder="Paste the device token" />
      <button id="connect">Connect & Sync</button>
      <p id="setupError" class="error"></p>
    </section>

    <section id="player" hidden>
      <img id="image" alt="" hidden>
      <video id="video" playsinline preload="auto" hidden></video>
      <div id="empty" class="empty">No media available</div>
      <div id="status" class="status">Ready</div>
      <div id="sync" class="sync" hidden>
        <div class="sync-title">Syncing media… <span id="syncText">0%</span></div>
        <div class="track"><div id="syncBar" class="bar"></div></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
